# Проверка на каждый push: статьи разбираются без ошибок, сборщик и синхронизация проходят тесты.
# Красный CI не останавливает сервер (он забирает main сам), но ломаная статья просто не опубликуется —
# сборщик на сервере пропускает её и пишет в лог.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 build.py --check
      - run: python3 build.py --out /tmp/blog
      - name: .pages.yml по схеме Pages CMS
        run: |
          mkdir -p tools/.pcms
          curl -fsSL https://raw.githubusercontent.com/pagescms/pagescms/6f4e860a35d934406580287e7042e5e111e207a1/lib/config-schema.ts \
            | sed 's|import { fieldTypes } from "@/fields/registry";|const fieldTypes = new Set(["boolean","code","date","file","image","number","reference","rich-text","select","string","text","uuid"]);|' \
            > tools/.pcms/config-schema.ts
          npm i --no-save --silent zod@3 js-yaml@4 tsx@4
          npx tsx tools/check_pages_config.mjs .pages.yml
